; Configuração do ERP Vendas.
; Valores prontos para execução local, integrados à API do ERP Financeiro
; (Financeiro/Financeiro.API/appsettings.json).

[Database]
; Sem a chave Database, o sistema usa o arquivo CARTSYS_ERP_VENDAS.FDB
; da mesma pasta do executável. Para outro local, informe o caminho completo:
; Database=C:\CartSys\CARTSYS_ERP_VENDAS.FDB
Server=localhost
Port=3050
UserName=SYSDBA
Password=masterkey
CharacterSet=UTF8

[Api]
; API REST embutida (recebe quitações e cancelamentos do ERP Financeiro).
Habilitada=1
Porta=9000
; Somente local: ERP Financeiro na mesma máquina (evita o aviso do Firewall).
Bind=127.0.0.1
; Deve ser igual a ErpVendas:ApiKey do appsettings.json do ERP Financeiro.
ApiKey=troque-esta-chave-vendas

[Financeiro]
BaseUrl=http://localhost:5001/api/v1
; Deve ser igual a Seguranca:ApiKeys:ErpVendas do appsettings.json do ERP Financeiro.
ApiKey=troque-esta-chave-financeiro
TimeoutMs=10000

[Smtp]
; Servidor SMTP para o e-mail de confirmação do pedido.
; Para testes locais: smtp4dev ou Papercut SMTP (porta 25).
Host=localhost
Porta=25
Usuario=
Senha=
; UsarTLS=1 exige libeay32.dll e ssleay32.dll ao lado do executável.
UsarTLS=0
Remetente=vendas@cartsys.local
NomeRemetente=CartSys ERP Vendas

[Outbox]
Habilitado=1
IntervaloSegundos=15
LoteMaximo=20
MaxTentativas=10
